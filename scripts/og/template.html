<!doctype html><html lang="{{lang}}"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#000;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;position:relative}
body::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,#fff 0 1px,transparent 1px 4px);opacity:.05}
.glow{position:absolute;inset:0;background:radial-gradient(40% 60% at 25% 35%,rgba(157,155,255,.18),transparent 70%),radial-gradient(40% 60% at 75% 60%,rgba(62,230,168,.16),transparent 70%)}
.wrap{position:relative;padding:72px 80px;height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:20px}
.top img{width:84px;height:84px;border-radius:50%;box-shadow:0 0 0 3px #000,0 0 0 4px #2c2c2f}
.name{font-size:34px;font-weight:600;line-height:1.2;letter-spacing:-.02em}.role{font:500 20px/1.3 Menlo,monospace;color:#86868b;margin-top:6px}
.role .d{color:#9d9bff}.role .o{color:#3ee6a8}
h1{margin:auto 0 0;font-size:84px;line-height:1.02;letter-spacing:-.045em;font-weight:700}
h1 span{display:block;background:linear-gradient(90deg,#9d9bff,#3ee6a8);-webkit-background-clip:text;color:transparent;padding-bottom:6px}
.foot{margin-top:36px;display:flex;justify-content:space-between;align-items:center;font:500 22px/1 Menlo,monospace;color:#86868b}
.foot b{color:#3ee6a8;font-weight:500}.foot .url{color:#f5f5f7}
</style></head><body><div class="glow"></div><div class="wrap">
<div class="top"><img src="{{avatar}}" alt=""><div><div class="name">Toni Ruiz</div><div class="role"><span class="d">Developer</span> &amp; <span class="o">DevOps</span> · Barcelona</div></div></div>
<h1>{{line1}}<span>{{line2}}</span></h1>
<div class="foot"><span><b>$</b> {{tagline}}</span><span class="url">toniruiz.es</span></div>
</div></body></html>
