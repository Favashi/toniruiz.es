<!doctype html><html lang="{{lang}}"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#e6e4df;color:#232322;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;position:relative}
.wrap{position:relative;padding:72px 80px;height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:20px}
.top img{width:84px;height:84px;border-radius:50%}
.name{font-size:34px;font-weight:600;line-height:1.2;letter-spacing:-.02em}.role{font:500 20px/1.3 Menlo,monospace;color:#59574f;margin-top:6px}
.role .d,.role .o{color:#232322}
h1{margin:auto 0 0;font-size:84px;line-height:1.2;letter-spacing:-.03em;font-weight:500}
h1 span{display:block}h1 i{font-style:normal;text-decoration:underline;text-decoration-color:#f7c600;text-decoration-thickness:.15em;text-decoration-skip-ink:none;text-underline-offset:.1em}
.foot{margin-top:36px;display:flex;justify-content:space-between;align-items:center;font:500 22px/1 Menlo,monospace;color:#59574f}
.foot b{background:#f7c600;color:#1c1c1b;padding:2px 8px;border-radius:4px;font-weight:500}.foot .url{color:#232322}
</style></head><body><div class="wrap">
<div class="top"><img src="{{avatar}}" alt=""><div><div class="name">Toni Ruiz</div><div class="role"><span class="d">Developer</span> &amp; <span class="o">DevOps</span> · Barcelona</div></div></div>
<h1>{{line1}}<span>{{line2}}</span></h1>
<div class="foot"><span><b>$</b> {{tagline}}</span><span class="url">toniruiz.es</span></div>
</div></body></html>
