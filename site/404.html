<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Página no encontrada / Page not found · Toni Ruiz</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#e6e4df">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: #e6e4df; color: #e8e6e1;
      font: 400 .9375rem/1.6 "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    }
    .term { width: min(640px, 100%); padding: 10px; border-radius: 16px; background: #2a2a28; box-shadow: inset 0 1px 0 rgba(255,255,255,.1); }
    .bar { padding: 2px 4px 8px; font-size: .75rem; line-height: 1; color: #f0eee9; }
    .body { padding: 20px; border-radius: 8px; background: #0a0a09; }
    pre { margin: 0; white-space: pre-wrap; font: inherit; }
    .ok { color: #f7c600; } .dv { color: #c9c6be; } .err { color: #ff8a70; } .dim { color: #93918a; }
    a { color: #f0eee9; }
  </style>
</head>
<body>
  <main class="term">
    <div class="bar">toni@barcelona: ~</div>
    <div class="body">
<pre><span class="ok">toni@barcelona</span>:<span class="dv">~</span>$ cd <span id="path">/esta-pagina</span>
<span class="err">cd: no existe el archivo o el directorio</span>
<span class="dim">Error 404: la página que buscas no está aquí.
           The page you are looking for is not here.</span>

<span class="ok">toni@barcelona</span>:<span class="dv">~</span>$ <a href="/">cd ~</a>     <span class="dim"># volver al inicio</span>
<span class="ok">toni@barcelona</span>:<span class="dv">~</span>$ <a href="/en/">cd ~/en</a>  <span class="dim"># back to home (English)</span></pre>
    </div>
  </main>
  <script>
    document.getElementById('path').textContent = decodeURIComponent(location.pathname);
  </script>
</body>
</html>
